<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato - Bootstrap</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #212529;
      color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 1rem 0;               /* margem vertical extra */
    }
    .form-container {
      background-color: #2c3034;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.3);
    }
    .form-label {
      font-weight: 500;
      margin-bottom: .5rem;
    }
    .form-control,
    .form-control:focus {
      background-color: #1a1d20;
      border: 1px solid #343a40;
      color: #f8f9fa;
    }
    .form-control::placeholder {
      color: #6c757d;
    }
    .btn-submit {
      background-color: #dc3545;
      border: none;
      padding: .6rem 1.5rem;
      font-weight: 500;
    }
    
    .btn-submit:hover {
      background-color: #bb2d3b;
    }
    .submeter {
        justify-self: end;
    }

    /* ----------  RESPONSIVIDADE  ---------- */
    @media (max-width: 575.98px) {
      /* Mobile: quase 100 % da largura (1rem de margem) */
      .form-container {
        margin-left: 1rem;
        margin-right: 1rem;
        padding: 2rem;               /* um pouco menos de padding interno */
      }
    }
    @media (min-width: 576px) and (max-width: 767.98px) {
      .form-container { padding: 2.3rem; }
    }
    @media (min-width: 768px) and (max-width: 991.98px) {
      .form-container { padding: 2.5rem; }
    }
  </style>
</head>
<body>

<div class="container-fluid px-0">
  <div class="row justify-content-center">
    <!-- 
         col-12  → 100 % em mobile 
         col-sm-10, col-md-8, col-lg-6, col-xl-5 → tamanhos progressivamente menores 
    -->
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="form-container mx-auto">
        <h4 class="mb-4  ">Contate-me algo</h4>

        <form>
          <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome"
                   placeholder="Digite seu nome" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email"
                   placeholder="email@exemplo.com" required>
          </div>

          <div class="mb-3">
            <label for="telefone" class="form-label">Telefone:</label>
            <input type="tel" class="form-control" id="telefone"
                   placeholder="(DDD) xxxxx-xxxx" required>
          </div>


          <div class="mb-4">
            <label for="mensagem" class="form-label">Mensagem</label>
            <textarea class="form-control" id="mensagem" rows="4"
                      placeholder="Mensagem..." required></textarea>
          </div>

          <div class="submeter">
            <button type="submit" class="btn btn-submit text-white">
              Enviar mensagem
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (opcional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Máscara de telefone com IMask -->
<script src="https://unpkg.com/imask"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    IMask(document.getElementById('telefone'), {
      mask: '(000) 00000-0000'
    });
  });
</script>

</body>
</html>
