<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--custom css-->
    <link rel="stylesheet" href="style.css">
    <!--awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=REM:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>PBAESSE</title>
</head>

<body>

    <header class="container py-3">
        <div class="d-flex justify-content-between align-items-center">


            <h2 class="m-0">PBAESSE</h2>


            <nav class="d-none d-lg-flex align-items-center gap-4">
                <a href="#">HOME</a>
                <a href="#">MÚSICAS</a>
                <a href="#">FRASES</a>
                <a href="#">PROJETOS</a>
                <a href="#">QUEM É BAESSE</a>
                <a href="#">RECOMENDAÇÕES</a>
                <a href="#">CONTATO</a>
            </nav>


            <form class="d-none d-md-flex align-items-center gap-2">
                <input type="search" class="form-control form-control-sm"
                    style="width: 150px; border: none; border-bottom: 1px solid white; background: transparent; color: white;"
                    placeholder="Buscar...">
                <button type="submit" class="btn btn-link text-white p-0">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>


            <div class="d-flex d-lg-none gap-2 align-items-center">

                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu"
                    aria-controls="offcanvasMenu">
                    <i class="fa-solid fa-bars"></i>
                </button>


                <button class="btn btn-search-mobile" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mobileSearch" aria-expanded="false" aria-controls="mobileSearch">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>


        <div class="collapse w-100 mt-2" id="mobileSearch">
            <div class="search-collapse">
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Buscar">
                    <button class="btn btn-outline-success" type="submit">OK</button>
                </form>
            </div>
        </div>


        <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasMenu"
            aria-labelledby="offcanvasMenuLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    aria-label="Fechar"></button>
            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">HOME</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">MÚSICAS</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">FRASES</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">PROJETOS</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">QUEM É BAESSE</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">RECOMENDAÇÕES</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">CONTATO</a></li>
                </ul>
            </div>
        </div>
    </header>

</body>

</html>
